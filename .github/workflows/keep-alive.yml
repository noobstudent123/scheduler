name: Supabase keep-alive
on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC (safe margin under Supabase's 7-day pause)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/schedules?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          [ "$code" -lt 500 ] || exit 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Record heartbeat
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt
          git config user.name  "keep-alive bot"
          git config user.email "actions@github.com"
          git add .keepalive/last-ping.txt
          git commit -m "chore: keep-alive heartbeat [skip ci]" || echo "no change to commit"
          git push
